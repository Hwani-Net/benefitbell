# Firebase App Hosting configuration — ai-project-ce41f
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 4
  cpu: 1
  memoryMiB: 512
  concurrency: 40

env:
  # ─── Firebase 클라이언트 (빌드타임 필요 → 직접 값) ───────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD661gFi59xD6kDYcbqpr4XOghQtGX9_JI
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ai-project-ce41f.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ai-project-ce41f
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ai-project-ce41f.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "287186253524"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:287186253524:web:98d9a50c0d48dabafa2d41

  # ─── 앱 공개 URL (SEO sitemap/robots, Kakao share, IndexNow) ──────────
  # 커스텀 도메인 (예: benefitbell.kr) 구매 후 App Hosting Domains에 연결 시
  # 이 값을 https://<custom-domain> 으로 변경 후 재배포.
  # Kakao OAuth redirect_uri는 x-forwarded-host 동적 구성이므로 이 값과 무관
  - variable: NEXT_PUBLIC_APP_URL
    value: https://benefitbell-web--ai-project-ce41f.asia-east1.hosted.app

  # ─── 카카오 JavaScript SDK 공개키 (클라이언트) ───────────────────────
  - variable: NEXT_PUBLIC_KAKAO_JS_KEY
    value: c66527c2112a3c696c719e3fe0c9e108

  # ─── 푸시 알림 VAPID 공개키 ──────────────────────────────────────────
  - variable: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    value: BPz8ovSj10yHojFgCbxzhGU8DziC7xhuhW5G6RfYy2y9lcdbTUfUeufgOpSbkDlGp4rxoGX0P3L0twZKChz7A7E

  # ─── GA / 결제 링크 (공개) ───────────────────────────────────────────
  - variable: NEXT_PUBLIC_GA_ID
    value: G-JQHPW3JBJP
  - variable: NEXT_PUBLIC_KAKAOPAY_PREMIUM_LINK
    value: https://qr.kakaopay.com/FVPcVDUAM

  # ─── 서버 전용 시크릿 (Cloud Secret Manager) ─────────────────────────
  - variable: DATA_GO_KR_SERVICE_KEY
    secret: DATA_GO_KR_SERVICE_KEY
  - variable: PUBLIC_DATA_API_KEY
    secret: DATA_GO_KR_SERVICE_KEY
  # AI provider fallback chain: Gemini → OpenAI → Anthropic.
  # 미등록 키는 자동 skip — 적어도 1개만 살아있으면 동작.
  # GEMINI/ANTHROPIC 키 발급 후 등록:
  #   echo -n "<key>" | gcloud secrets create GEMINI_API_KEY --data-file=- --project=ai-project-ce41f
  #   firebase apphosting:secrets:grantaccess GEMINI_API_KEY --backend benefitbell-web
  # 등록 완료 후 아래 주석 해제하고 재배포.
  # - variable: GEMINI_API_KEY
  #   secret: GEMINI_API_KEY
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  # - variable: ANTHROPIC_API_KEY
  #   secret: ANTHROPIC_API_KEY
  - variable: TOSS_SECRET_KEY
    secret: TOSS_SECRET_KEY
  - variable: VAPID_PRIVATE_KEY
    secret: VAPID_PRIVATE_KEY
  - variable: VAPID_SUBJECT
    value: mailto:stayicon@gmail.com
  - variable: CRON_SECRET
    secret: CRON_SECRET
  - variable: KAKAO_CLIENT_ID
    secret: KAKAO_CLIENT_ID
  - variable: KAKAO_CLIENT_SECRET
    secret: KAKAO_CLIENT_SECRET
  - variable: BIZINFO_API_KEY
    secret: BIZINFO_API_KEY
  - variable: DATA_GO_KR_SUBSIDY_KEY
    secret: DATA_GO_KR_SUBSIDY_KEY
  - variable: INDEXNOW_KEY
    secret: INDEXNOW_KEY
  # 어드민 전용: 결제 입금 확인 후 X-Admin-Secret 헤더로 즉시 활성화 시 사용
  - variable: ADMIN_ACTIVATION_SECRET
    secret: ADMIN_ACTIVATION_SECRET

